<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Botão Animado</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin: 50px;
}

button{
    position: relative;
    padding: 15px 30px;
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
    animation: mover 4s infinite;
}

@keyframes mover {
    0%{
        left: 0;
        background-color: blue;
    }

    50%{
        left: 300px;
        background-color: red;
    }

    100%{
        left: 0;
        background-color: green;
    }
}
</style>

</head>
<body>

<h1>Botão Animado</h1>

<button>Clique Aqui</button>

</body>
</html>
