
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Consulta de Notas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="cabecalho">
            <h1>Sistema de Consulta de Notas</h1>
            <p>Consulte a média e a situação acadêmica do estudante.</p>
        </header>

        <form id="formNotas">
            <div class="campo">
                <label for="nome">Nome do estudante</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Digite o nome completo"
                    autocomplete="name"
                >
            </div>

            <div class="notas">
                <div class="campo">
                    <label for="nota1">Nota 1</label>
                    <input
                        type="number"
                        id="nota1"
                        placeholder="0 a 10"
                        min="0"
                        max="10"
                        step="any"
                    >
                </div>

                <div class="campo">
                    <label for="nota2">Nota 2</label>
                    <input
                        type="number"
                        id="nota2"
                        placeholder="0 a 10"
                        min="0"
                        max="10"
                        step="any"
                    >
                </div>

                <div class="campo">
                    <label for="nota3">Nota 3</label>
                    <input
                        type="number"
                        id="nota3"
                        placeholder="0 a 10"
                        min="0"
                        max="10"
                        step="any"
                    >
                </div>
            </div>

            <div class="botoes">
                <button type="submit" class="btn-calcular">
                    Calcular média
                </button>

                <button type="reset" class="btn-limpar">
                    Reiniciar consulta
                </button>
            </div>
        </form>

        <section
            id="resultado"
            class="resultado"
            aria-live="polite"
            aria-atomic="true"
            hidden
        ></section>

        <footer>
            <p>Projeto acadêmico de Desenvolvimento Web</p>
        </footer>
    </main>
</body>
</html>
